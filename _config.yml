# Jekyll
theme: linkhub-jekyll-theme

# Site Configuration
name: Joel Hayse  # Name of your website
tagline: DM  # Set your preferred page title
description: "I see you’re the curious type, I like that.<br/>

Give it a shot and be a little spontaneous.<br/>

After all, life’s short and we’re only so young.<br/>

Let’s keep the conversation going, this just might be the start of a great story.<br/><br/>

- Joel<br/><br/>

Send me a message here👇"
favicon:
  path: https://www.busch.com/favicon.png # Path / URL to the favicon of your website (e.g., 'assets/images/favicon.png')
  type: png # File format of image. Change according to your image. Supported types: https://developer.mozilla.org/en-US/docs/Web/Media/Formats/Image_types
logo: assets/images/joel_headshot.png # Path / URL to the logo (e.g., 'assets/images/logo.png')
url: https://www.joelhayse.com # URL of your website
locale: en_GB # The value specifies the locale in which these tags are marked up. It follows the format `language_TERRITORY`.
ga4: # Google Analytics 4 measurement ID, for e.g. G-XXXXXXX (optional). Remove it if it’s not needed.
twitter:
  username: joel_hayse # Used for SEO
image:
  path: assets/images/joel_headshot.png # Used for SEO (og:image, twitter:image)
  type: png # File format of image.
  height: 100 # Pixels
  width: 100
  alt: logo

# Verified Badge Configuration
badge:
  enable: true # Set to 'true' or 'false' to enable / disable the badge
  icon: ri:verified-badge-fill  # Enter the icon name for the badge from Iconify Design (https://icon-sets.iconify.design/)
  color: '#dfb221'  # Define the color of the badge
 
# Defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"    

# Exclude
exclude: [README.md, Gemfile.lock, .jekyll-cache/, .github/, CHANGELOG.md, Gemfile, LICENSE.txt, funding.yml, linkhub-jekyll-theme.gemspec]